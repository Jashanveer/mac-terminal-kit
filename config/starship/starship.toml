"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000
palette = "graphite_signal"

format = """
$directory$git_branch$git_status$git_state$fill$cmd_duration$jobs$time
$character"""

[palettes.graphite_signal]
graphite_0 = "#111418"
graphite_1 = "#1d2228"
graphite_2 = "#5d6873"
text = "#d8dee9"
muted = "#8b96a1"
signal_green = "#9be28f"
signal_blue = "#7cc7ff"
signal_yellow = "#e6c76e"
signal_red = "#f07178"
signal_purple = "#c792ea"

[directory]
style = "bold signal_blue"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "signal_red"
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold signal_purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "signal_yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "×${count}"

[git_state]
style = "bold signal_red"
format = "[$state( $progress_current/$progress_total)]($style) "

[fill]
symbol = " "

[cmd_duration]
min_time = 1500
style = "muted"
format = "[$duration]($style) "
show_notifications = false

[jobs]
symbol = "✦"
style = "signal_yellow"
format = "[$symbol $number]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold signal_green)"
error_symbol = "[❯](bold signal_red)"
vimcmd_symbol = "[❮](bold signal_blue)"
vimcmd_replace_one_symbol = "[❮](bold signal_purple)"
vimcmd_replace_symbol = "[❮](bold signal_purple)"
vimcmd_visual_symbol = "[❮](bold signal_yellow)"
